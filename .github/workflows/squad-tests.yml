name: squad-tests
on:
  push:
    paths: ['squad/**', '.github/workflows/squad-tests.yml']
  pull_request:
    paths: ['squad/**', '.github/workflows/squad-tests.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문법 검사
        run: for f in squad/assets/*.js squad/assets/pix/*.js; do node --input-type=module --check < "$f"; done
      - name: 규칙·레벨·봇 밸런스 테스트
        run: node --test squad/tests/run.mjs
      - name: 도트 그림·글꼴·바닥 테스트
        run: node --test squad/tests/art.mjs
